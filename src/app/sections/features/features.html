<section class="ws-section" id="features">
  <div class="site-container">
    <div class="ws-head" msReveal>
      <span class="ws-kicker">{{ 'features.kicker' | translate }}</span>
      <h2>{{ 'features.title' | translate }}</h2>
      <p>{{ 'features.lead' | translate }}</p>
    </div>
    <div class="ws-features" msReveal>
      @for (f of items; track f.key) {
        <article class="ws-feature">
          <span class="ws-icon"><i class="icon" [class]="f.icon"></i></span>
          <h3>{{ 'features.' + f.key + '.t' | translate }}</h3>
          <p>{{ 'features.' + f.key + '.d' | translate }}</p>
        </article>
      }
    </div>
    @if (showMore()) {
      <div class="mt-10 flex justify-center">
        <a pButton [outlined]="true" [routerLink]="site.link('features')">
          <span pButtonLabel>{{ 'features.allFeatures' | translate }}</span><i class="pi pi-arrow-right" pButtonIcon></i>
        </a>
      </div>
    }
  </div>
</section>
