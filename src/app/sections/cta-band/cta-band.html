<section class="ws-section" style="padding-top: 0">
  <div class="site-container">
    <div class="ws-cta-band" msReveal>
      <div>
        <h2>{{ 'cta.title' | translate: platform.trial() }}</h2>
        <p>{{ 'cta.lead' | translate }}</p>
      </div>
      <div class="ws-cta">
        <a pButton size="large" class="cta-light" [href]="site.appUrl('sign-up')"><span pButtonLabel>{{ 'cta.start' | translate }}</span></a>
        <a pButton size="large" class="cta-ghost" [outlined]="true" [href]="site.appUrl('login')"><span pButtonLabel>{{ 'cta.login' | translate }}</span></a>
      </div>
    </div>
  </div>
</section>
